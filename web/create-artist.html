<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Create Artist</title>

  <link rel="stylesheet"
        href="style.css">

</head>
<body>

  <section class="loginSection">

    <div class="loginCard">

      <h1>
        Create Artist
      </h1>

      <p>
        Build your artist profile
      </p>

      <input
      type="text"
      id="artistName"
      placeholder="Artist Name">

      <input
      type="text"
      id="artistCategory"
      placeholder="Category">

      <input
       type="file"
       id="artistImage">

       <input
       type="text"
       id="artistPhone"
       placeholder="WhatsApp Number">

      <textarea
      id="artistBio"
      placeholder="Artist Bio"></textarea>

      <button
      class="loginPageBtn"
      id="createArtistSubmit">

        Create Profile

      </button>

      <p id="artistMessage"></p>

    </div>

  </section>

  <script src="create-artist.js"></script>

</body>
</html>
