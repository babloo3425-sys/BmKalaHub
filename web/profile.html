<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Artist Profile</title>

  <link rel="stylesheet"
        href="style.css">

</head>
<body>

  <section class="profileSection">

    <img
    id="profileImg"
    class="profileImg">

    <h1 id="profileName"></h1>

    <h3 id="profileCategory"></h3>

    <p id="profileBio"></p>

    <div class="profileStats">

      <div class="statBox">

        <h2 id="profileFollowers">

         0

       </h2>

        <p>Followers</p>

      </div>

      <div class="statBox">

        <h2 id="profileBookings">

         0

        </h2>

        <p>Bookings</p>
 
      </div>

      <div class="statBox">

        <h2 id="profileRating">

         0

        </h2>

        <p>Rating</p>

      </div>

    </div>

         <div class="reviewsContainer">

  <h2>

    Reviews

  </h2>

  <div id="reviewsList">

  </div>

</div>

    <div class="profileButtons">

      <div class="reviewForm">

       <input
         type="text"
         id="reviewName"
         placeholder="Your Name">

        <textarea
          id="reviewText"
          placeholder="Write your review"></textarea>

         <button id="sendReviewBtn">

         Send Review

       </button>

      </div>

      <div class="ratingBox">

     <button
      type="button"
      class="starBtn"
      data-rating="1">

     ⭐1

     </button>

     <button
      type="button"
      class="starBtn"
      data-rating="2">

     ⭐2

     </button>
 
     <button
      type="button"
      class="starBtn"
      data-rating="3">

      ⭐3

     </button>

     <button
      type="button"
      class="starBtn"
      data-rating="4">

      ⭐4

     </button>

     <button
      type="button"
      class="starBtn"
      data-rating="5">

     ⭐5

     </button>

    </div>

      <button
       class="profileBtn secondaryBtn"
       id="reviewBtn">

       Add Review

      </button>

       <button
        class="profileBtn"
        id="followBtn">

        Follow

       </button>

      <button
       class="profileBtn"
       id="bookArtistBtn">

       Book Artist

      </button>
 
    <button
        class="profileBtn secondaryBtn"
        id="whatsappBtn">

        WhatsApp

       </button>

      </div>

         <div class="bookingForm">

      <input
      type="text"
      id="customerName"
      placeholder="Your Name">

      <input
      type="text"
      id="customerPhone"
      placeholder="Your Phone">

      <input
       type="text"
       id="eventType"
       placeholder="Event Type">

       <input
        type="date"
        id="bookingDate">

      </div>

  </section>

  <script src="profile.js"></script>

</body>
</html>
