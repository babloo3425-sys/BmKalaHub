<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <link rel="stylesheet"
        href="style.css">

</head>
<body>

  <section class="loginSection">

    <div class="loginCard">

      <h1>
        Welcome Back
      </h1>

      <p>
        Login to BmKalaHub
      </p>

      <input
        type="email"
        id="loginEmail"
        placeholder="Enter Email">

      <input
        type="password"
        id="loginPassword"
        placeholder="Enter Password">
 
        <button
         type="button"
        id="toggleLoginPassword">

         Show

         </button>

        <button
         class="loginPageBtn"
         id="loginPageBtn">
         Login
        </button>

       <p id="loginMessage"></p>
       <p class="signupText">

       Don't have an account?

      <span id="signupLink">
       Signup
      </span>

      </p>

     </div>

    </section>

     <script src="login.js"></script>

  </body>
  </html>
