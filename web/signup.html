<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Signup</title>

  <link rel="stylesheet"
        href="style.css">

</head>
<body>

  <section class="loginSection">

    <div class="loginCard">

      <h1>
        Create Account
      </h1>

      <p>
        Join BmKalaHub
      </p>

     <input
        type="text"
        id="signupName"
        placeholder="Enter Name">

     <input
         type="email"
         id="signupEmail"
         placeholder="Enter Email">
 
     <input
         type="password"
         id="signupPassword"
         placeholder="Enter Password">

     <button
         class="loginPageBtn"
         id="signupBtn">
         Signup
     </button>
      
      <p id="signupMessage"></p>
      <p class="signupText">

        Already have an account?

        <span id="loginLink">
          Login
        </span>

      </p>

    </div>

  </section>

  <script src="signup.js"></script>

</body>
</html>
