   <!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Edit Artist</title>

  <link rel="stylesheet"
        href="style.css">

</head>
<body>

  <section class="loginSection">

    <div class="loginCard">

      <h1>
        Edit Artist
      </h1>

      <p>
        Update your artist profile
      </p>

      <input
      type="text"
      id="editArtistName"
      placeholder="Artist Name">

      <input
      type="text"
      id="editArtistCategory"
      placeholder="Category">

      <input
      type="file"
      id="editArtistImage">

       <input
        type="text"
        id="editArtistPhone"
        placeholder="WhatsApp Number">

      <textarea
      id="editArtistBio"
      placeholder="Artist Bio"></textarea>

      <button
      class="loginPageBtn"
      id="updateArtistBtn">

        Update Profile

      </button>

      <p id="editArtistMessage"></p>

    </div>

  </section>

  <script src="edit-artist.js"></script>

</body>
</html>
