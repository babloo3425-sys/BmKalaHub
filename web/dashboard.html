   <!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Dashboard</title>

  <link rel="stylesheet"
        href="style.css">

</head>
<body>

  <section class="dashboardSection">

    <div class="dashboardHero">

  <div>

    <p class="dashboardTag">
      Welcome Back
    </p>


    <p class="dashboardSub">
      Manage your artist profile,
      bookings and platform growth.
    </p>

  </div>

</div>

    <div class="dashboardHeader">

      <h1>
        Artist Dashboard
      </h1>

      <button id="dashboardLogout">
        Logout
      </button>

    </div>

       <div class="dashboardLayout">

  <div>

    <div id="dashboardArtist">

    </div>

    <div class="quickActions">

      <button id="editProfileBtn">

        Edit Profile

      </button>

      <button id="viewPublicBtn">

        View Public Profile

      </button>
       <!--
        <button id="featuredBtn">

          Make Featured

        </button>
       -->
      <button id="deleteProfileBtn">

        Delete Profile

      </button>

    </div>

  </div>

  <div>

    <div class="statsGrid">

      <div class="statCard">

        <h3>
          Profile Views
        </h3>

        <h2 id="viewsCount">

         0

        </h2>

      </div>

      <div class="statCard">

        <h3>
          Followers
        </h3>

        <h2 id="followersCount">

         0

        </h2>

      </div>

      <div class="statCard">

        <h3>
          Bookings
        </h3>

        <h2 id="bookingCount">

         0

        </h2>

      </div>

      <div class="statCard">

        <h3>
          Reviews
        </h3>

        <h2 id="reviewsCount">

         0

        </h2>

      </div>

    </div>

  </div>

    <div class="dashboardBookings">

   <h2>

    Booking Requests

   </h2>

   <div id="bookingsList">

  </div>

 </div>

</div>

  </section>

  <script src="dashboard.js"></script>

</body>
</html>
